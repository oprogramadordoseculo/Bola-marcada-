name: Atualizar resultados das loterias

on:
  schedule:
    # 00:30 e 03:00 UTC = 21:30 e 00:00 de Brasília (depois dos sorteios)
    - cron: "30 0 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualizar-resultados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      # Segredo com o JSON da conta de servico do Firebase (Settings > Secrets > Actions).
      FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar resultados da Caixa
        run: python3 scripts/atualizar_resultados.py

      - name: Salvar no repositório (se mudou)
        run: |
          if git diff --quiet -- data/; then
            echo "Nenhum resultado novo."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Resultados atualizados $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/setup-node@v4
        if: ${{ env.FIREBASE_SA != '' }}
        with:
          node-version: "20"

      - name: Conferir jogos salvos dos usuarios
        if: ${{ env.FIREBASE_SA != '' }}
        working-directory: server
        run: |
          npm ci --omit=dev --no-audit --no-fund
          node conferir.js ../data
